<script>
(function () {
  'use strict';

  var CLAVE = 'asistente-prompts';
  var estado = { prompts: [], filtro: '', categoria: 'todos', favoritos: [], meta: {} };
  var $ = function (id) { return document.getElementById(id); };

  /* ── Puente con el backend (o con el mock de la vista previa) ── */
  function api(nombre) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, mal) {
      if (window.MOCK_API && window.MOCK_API[nombre]) {
        setTimeout(function () {
          try { ok(window.MOCK_API[nombre].apply(null, args)); } catch (e) { mal(e); }
        }, window.MOCK_API.__retardo || 220);
        return;
      }
      google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[nombre].apply(null, args);
    });
  }

  /* ── Persistencia ── */
  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify({
        producto: $('producto').value,
        url: $('url').value,
        extra: $('extra').value,
        meta: estado.meta,
        favoritos: estado.favoritos
      }));
    } catch (e) { /* incógnito */ }
  }

  function restaurar() {
    var d;
    try { d = JSON.parse(localStorage.getItem(CLAVE) || '{}'); } catch (e) { d = {}; }
    $('producto').value = d.producto || '';
    $('url').value = d.url || '';
    $('extra').value = d.extra || '';
    estado.favoritos = Array.isArray(d.favoritos) ? d.favoritos : [];
    if (d.extra) $('extra').closest('details').open = true;
    if (d.meta && (d.meta.titulo || d.meta.descripcion || d.meta.precio)) pintarLectura(d.meta);
  }

  /* ── Variables de plantilla ──
     modoMuestra deja marcadores visibles en lugar de vaciar los huecos,
     para que la tarjeta enseñe la forma del prompt antes de rellenar nada. */
  function variables(modoMuestra) {
    var url = $('url').value.trim();
    var m = url.match(/^https?:\/\/([^\/\?#:]+)/i);
    var hoy = new Date();
    var v = {
      producto: $('producto').value.trim(),
      url: url,
      titulo: $('mTitulo').value.trim(),
      descripcion: $('mDescripcion').value.trim(),
      precio: $('mPrecio').value.trim(),
      sitio: m ? m[1].replace(/^www\./i, '') : '',
      extra: $('extra').value.trim(),
      fecha: hoy.getFullYear() + '-' +
        String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
        String(hoy.getDate()).padStart(2, '0')
    };
    if (modoMuestra) {
      Object.keys(v).forEach(function (k) { if (!v[k]) v[k] = '‹' + k + '›'; });
    }
    return v;
  }

  var PATRON = /\{\{\s*(\w+)\s*\}\}/g;
  var ORDEN_VARS = ['producto', 'url', 'titulo', 'descripcion', 'precio', 'sitio', 'extra', 'fecha'];

  /** Variables que consume una plantilla, en orden de aparición y sin repetir. */
  function usadas(plantilla) {
    var lista = [], m, re = new RegExp(PATRON.source, 'g');
    while ((m = re.exec(plantilla))) {
      if (lista.indexOf(m[1]) === -1) lista.push(m[1]);
    }
    return lista;
  }

  /** Tira de estado: qué huecos tienen valor ahora mismo. */
  function pintarVariables() {
    var v = variables();
    var cont = $('vlista');
    cont.innerHTML = '';
    ORDEN_VARS.forEach(function (k) {
      var s = document.createElement('span');
      s.className = 'var' + (String(v[k] || '').trim() ? ' lleno' : '');
      s.textContent = k;
      s.title = String(v[k] || '').trim() || 'sin valor: las líneas que solo usen esta variable desaparecen';
      cont.appendChild(s);
    });
  }

  /**
   * Rellena la plantilla. Si una línea contiene SOLO variables vacías,
   * la línea entera desaparece: no quedan etiquetas huérfanas tipo "Precio:".
   */
  function rellenar(plantilla, vars) {
    return String(plantilla).split('\n').filter(function (linea) {
      var usadas = linea.match(PATRON);
      if (!usadas) return true;
      return usadas.some(function (t) {
        return String(vars[t.replace(/[{}\s]/g, '')] || '').trim() !== '';
      });
    }).map(function (linea) {
      return linea.replace(PATRON, function (_, clave) {
        return vars[clave] != null ? vars[clave] : '';
      });
    }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function palabras(texto) {
    var n = texto.trim().split(/\s+/).filter(Boolean).length;
    return n;
  }

  /* ── Portapapeles, con dos planes B ── */
  function copiar(texto) {
    return new Promise(function (ok, mal) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(ok).catch(function () { viejaEscuela(texto, ok, mal); });
      } else {
        viejaEscuela(texto, ok, mal);
      }
    });
  }

  function viejaEscuela(texto, ok, mal) {
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, texto.length);
    var bien = false;
    try { bien = document.execCommand('copy'); } catch (e) { bien = false; }
    document.body.removeChild(ta);
    bien ? ok() : mal(new Error('sin-portapapeles'));
  }

  var relojToast;
  function toast(texto, malo) {
    var t = $('toast');
    t.textContent = texto;
    t.className = 'ver' + (malo ? ' malo' : '');
    clearTimeout(relojToast);
    relojToast = setTimeout(function () { t.className = ''; }, 2600);
  }

  function escapar(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── Filtros ── */
  function esFavorito(p) { return estado.favoritos.indexOf(p.nombre) > -1; }

  function categorias() {
    var vistas = [];
    estado.prompts.forEach(function (p) {
      if (vistas.indexOf(p.categoria) === -1) vistas.push(p.categoria);
    });
    return vistas;
  }

  function coincide(p) {
    if (estado.categoria === 'favoritos' && !esFavorito(p)) return false;
    if (estado.categoria !== 'todos' && estado.categoria !== 'favoritos' && p.categoria !== estado.categoria) return false;
    if (!estado.filtro) return true;
    var q = estado.filtro.toLowerCase();
    return (p.nombre + ' ' + p.categoria + ' ' + p.descripcion + ' ' + p.destino + ' ' + p.plantilla)
      .toLowerCase().indexOf(q) > -1;
  }

  function pintarChips() {
    var cont = $('chips');
    cont.innerHTML = '';
    var opciones = [{ id: 'todos', texto: 'Todos', n: estado.prompts.length }];
    if (estado.favoritos.length) {
      opciones.push({
        id: 'favoritos', texto: '★ Favoritos',
        n: estado.prompts.filter(esFavorito).length
      });
    }
    categorias().forEach(function (c) {
      opciones.push({
        id: c, texto: c,
        n: estado.prompts.filter(function (p) { return p.categoria === c; }).length
      });
    });

    opciones.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'chip rotulo';
      b.type = 'button';
      b.setAttribute('aria-pressed', String(estado.categoria === o.id));
      b.innerHTML = escapar(o.texto) + ' <span class="cuenta">' + o.n + '</span>';
      b.addEventListener('click', function () {
        estado.categoria = o.id;
        pintarChips();
        pintarLista();
      });
      cont.appendChild(b);
    });
  }

  /* ── Rejilla ── */
  function pintarLista() {
    var cont = $('lista');
    var visibles = estado.prompts.filter(coincide);
    var vars = variables(true);
    var reales = variables();
    pintarVariables();

    $('contador').textContent = visibles.length === estado.prompts.length
      ? estado.prompts.length + ' prompts'
      : visibles.length + ' de ' + estado.prompts.length + ' prompts';

    cont.innerHTML = '';

    if (!visibles.length) {
      $('estado').hidden = false;
      $('estado').innerHTML = estado.prompts.length
        ? 'Ningún prompt coincide con el filtro.'
        : 'La hoja no tiene prompts activos. Añade filas y pulsa <b>Recargar</b>.';
      return;
    }
    $('estado').hidden = true;

    var agrupar = estado.categoria === 'todos' && !estado.filtro;

    if (!agrupar) {
      var rejilla = document.createElement('div');
      rejilla.className = 'rejilla';
      visibles.forEach(function (p) { rejilla.appendChild(ficha(p, vars, reales, false)); });
      cont.appendChild(rejilla);
      return;
    }

    categorias().forEach(function (c) {
      var delGrupo = visibles.filter(function (p) { return p.categoria === c; });
      if (!delGrupo.length) return;

      var grupo = document.createElement('section');
      grupo.className = 'grupo';
      var cab = document.createElement('div');
      cab.className = 'grupo-cab';
      cab.innerHTML = '<h2>' + escapar(c) + '</h2><span class="marcador">' + delGrupo.length + '</span>';
      grupo.appendChild(cab);

      var r = document.createElement('div');
      r.className = 'rejilla';
      delGrupo.forEach(function (p) { r.appendChild(ficha(p, vars, reales, true)); });
      grupo.appendChild(r);
      cont.appendChild(grupo);
    });
  }

  function ficha(p, vars, reales, agrupado) {
    var completo = rellenar(p.plantilla, vars);
    var n = palabras(completo);
    // En 4 líneas de tarjeta no caben renglones vacíos: se enseñan las 4 primeras con contenido.
    var muestra = completo.split('\n').filter(function (l) { return l.trim(); }).slice(0, 4).join('\n');
    var tokens = usadas(p.plantilla).map(function (k) {
      var vacia = !String(reales[k] || '').trim();
      return '<span class="' + (vacia ? 'falta-dato' : '') + '">' + escapar(k) + '</span>';
    }).join('');

    var el = document.createElement('article');
    el.className = 'ficha';
    el.innerHTML =
      '<div class="ficha-cab">' +
      '  <span class="ficha-cat rotulo">' + escapar(agrupado ? (p.destino || 'Prompt') : p.categoria) + '</span>' +
      '  <button class="estrella" type="button" aria-pressed="' + esFavorito(p) + '" title="Marcar como favorito">' +
         (esFavorito(p) ? '★' : '☆') + '</button>' +
      '</div>' +
      '<h3>' + escapar(p.nombre) + '</h3>' +
      (p.descripcion ? '<p class="resumen">' + escapar(p.descripcion) + '</p>' : '') +
      '<pre class="muestra">' + escapar(muestra) + '</pre>' +
      '<div class="usa" title="Variables que usa esta plantilla. Tachadas: sin valor ahora mismo.">' + tokens + '</div>' +
      '<div class="ficha-pie">' +
      '  <span class="medida">≈' + n + ' palabras' +
           (!agrupado && p.destino ? ' · ' + escapar(p.destino) : '') + '</span>' +
      '  <button class="btn-plano" type="button" data-accion="ver">Ver</button>' +
      '  <button class="btn" type="button" data-accion="copiar">Copiar</button>' +
      '</div>';

    el.querySelector('.estrella').addEventListener('click', function (ev) {
      var i = estado.favoritos.indexOf(p.nombre);
      i > -1 ? estado.favoritos.splice(i, 1) : estado.favoritos.push(p.nombre);
      guardar();
      ev.currentTarget.textContent = esFavorito(p) ? '★' : '☆';
      ev.currentTarget.setAttribute('aria-pressed', String(esFavorito(p)));
      pintarChips();
      if (estado.categoria === 'favoritos') pintarLista();
    });
    el.querySelector('[data-accion="ver"]').addEventListener('click', function () { abrirModal(p); });
    el.querySelector('[data-accion="copiar"]').addEventListener('click', function (ev) { alCopiar(p, ev.currentTarget); });

    return el;
  }

  /* ── Acciones ── */
  function faltaProducto() {
    if ($('producto').value.trim()) return false;
    $('producto').classList.add('falta');
    $('producto').focus();
    $('producto').scrollIntoView({ block: 'center', behavior: 'smooth' });
    toast('Escribe primero el nombre del producto', true);
    setTimeout(function () { $('producto').classList.remove('falta'); }, 1800);
    return true;
  }

  function alCopiar(p, boton) {
    if (faltaProducto()) return;
    var texto = rellenar(p.plantilla, variables());
    copiar(texto).then(function () {
      boton.textContent = '✓ Copiado';
      boton.classList.add('hecho');
      setTimeout(function () {
        boton.textContent = 'Copiar';
        boton.classList.remove('hecho');
      }, 1600);
      toast('Prompt copiado · ' + palabras(texto) + ' palabras');
    }).catch(function () {
      abrirModal(p, true);
      toast('El navegador bloqueó el portapapeles: copia desde aquí', true);
    });
  }

  function abrirModal(p, seleccionar) {
    if (faltaProducto()) return;
    var texto = rellenar(p.plantilla, variables());
    $('dlgTitulo').textContent = p.nombre;
    $('dlgTexto').value = texto;
    $('dlgMedida').textContent = p.categoria + ' · ≈' + palabras(texto) + ' palabras · ' + texto.length + ' caracteres';
    $('modal').showModal();
    if (seleccionar) { $('dlgTexto').focus(); $('dlgTexto').select(); }
  }

  function pintarLectura(datos) {
    estado.meta = datos || {};
    $('mTitulo').value = datos.titulo || '';
    $('mDescripcion').value = datos.descripcion || '';
    $('mPrecio').value = datos.precio || '';
    $('metaSitio').textContent = datos.sitio || '';
    $('lectura').hidden = false;
  }

  function leerUrl() {
    var url = $('url').value.trim();
    $('avisoUrl').hidden = true;
    if (!url) {
      $('lectura').hidden = true;
      estado.meta = {};
      guardar();
      pintarLista();
      return;
    }

    var b = $('btnLeer');
    b.disabled = true;
    b.textContent = 'Leyendo…';

    api('leerUrl', url).then(function (r) {
      if (r.ok) {
        pintarLectura(r);
        toast('Datos leídos de ' + (r.sitio || 'la página'));
      } else {
        pintarLectura({ sitio: r.sitio || '', titulo: '', descripcion: '', precio: '' });
        $('avisoUrl').textContent = r.error + ' La URL se sigue insertando en los prompts.';
        $('avisoUrl').hidden = false;
      }
      guardar();
      pintarLista();
    }).catch(function (e) {
      $('avisoUrl').textContent = 'Error al leer la URL: ' + ((e && e.message) || e);
      $('avisoUrl').hidden = false;
    }).then(function () {
      b.disabled = false;
      b.textContent = 'Leer URL';
    });
  }

  function cargarPrompts(forzar) {
    $('estado').hidden = false;
    $('estado').textContent = forzar ? 'Recargando…' : 'Cargando prompts…';
    return api('getPrompts', !!forzar).then(function (lista) {
      estado.prompts = lista || [];
      $('lema').textContent = estado.prompts.length +
        ' plantillas que se rellenan solas con el producto y la URL.';
      pintarChips();
      pintarLista();
    }).catch(function (e) {
      var msg = (e && e.message) || String(e);
      $('estado').innerHTML = msg.indexOf('No hay hoja') > -1
        ? 'Todavía no hay hoja de prompts.<br>Abre el editor de Apps Script y ejecuta <code>crearHojaDePrompts()</code>.'
        : 'No pude leer los prompts:<br>' + escapar(msg);
      $('estado').hidden = false;
    });
  }

  /* ── Arranque ── */
  function iniciar() {
    restaurar();
    pintarVariables();

    var reloj;
    ['producto', 'url', 'extra', 'mTitulo', 'mDescripcion', 'mPrecio'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        estado.meta = {
          titulo: $('mTitulo').value,
          descripcion: $('mDescripcion').value,
          precio: $('mPrecio').value,
          sitio: $('metaSitio').textContent
        };
        guardar();
        pintarVariables();
        clearTimeout(reloj);
        reloj = setTimeout(pintarLista, 280);
      });
    });

    $('btnLeer').addEventListener('click', leerUrl);
    $('url').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); leerUrl(); }
    });

    $('buscar').addEventListener('input', function (e) {
      estado.filtro = e.target.value.trim();
      pintarLista();
    });

    $('btnRecargar').addEventListener('click', function () { cargarPrompts(true); });
    $('dlgCerrar').addEventListener('click', function () { $('modal').close(); });
    $('dlgCopiar').addEventListener('click', function () {
      copiar($('dlgTexto').value).then(function () {
        toast('Prompt copiado');
        $('modal').close();
      }).catch(function () {
        $('dlgTexto').focus();
        $('dlgTexto').select();
        toast('Pulsa Ctrl+C / Cmd+C para copiar', true);
      });
    });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        $('buscar').focus();
      }
    });

    api('getEstado').then(function (s) {
      if (s && s.hojaUrl) {
        $('linkHoja').href = s.hojaUrl;
        $('linkHoja').hidden = false;
      }
    }).catch(function () { /* sin enlace, no pasa nada */ });

    cargarPrompts(false);
  }

  document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
