<title>Asistente de Prompts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
  /* ───────────────────────────── Sistema ─────────────────────────────
     Color:  papel cálido neutro · tinta casi negra · navy institucional
             heredado del #2E4057 de la marca · terracota quemada como
             única señal (favoritos, avisos, campo obligatorio).
     Tipo:   IBM Plex Serif (identidad) · Sans (interfaz) · Mono (prompts).
     Trazo:  filete de 1px en vez de sombras. Radio 4px. Sin degradados.
  ──────────────────────────────────────────────────────────────────── */

  :root {
    --papel: #F5F4F0;
    --panel: #FFFFFF;
    --panel-2: #FAFAF7;
    --tinta: #12171E;
    --apagado: #69707C;
    --tenue: #8A909B;
    --linea: #E3E1D9;
    --linea-fuerte: #CBC8BC;

    --marca: #16324F;
    --senal: #B65B3C;
    --exito: #1C6B4F;

    --accion-fondo: #16324F;
    --accion-tinta: #FFFFFF;
    --accion-hover: #1F4468;

    --banda: #16324F;
    --banda-tinta: #F0F3F7;
    --banda-apagado: #9DB0C6;
    --banda-campo: rgba(255,255,255,.07);
    --banda-linea: rgba(255,255,255,.17);
    --banda-linea-fuerte: rgba(255,255,255,.34);

    --chip-fondo: transparent;
    --chip-activo: #16324F;
    --chip-activo-tinta: #FFFFFF;

    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radio: 4px;
    --ancho: 1180px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #0C1016;
      --panel: #131922;
      --panel-2: #0F151D;
      --tinta: #E3E6EA;
      --apagado: #8B929E;
      --tenue: #6E7684;
      --linea: #212934;
      --linea-fuerte: #34404F;

      --marca: #8FB6E4;
      --senal: #D9825C;
      --exito: #4FA684;

      --accion-fondo: #2C5C90;
      --accion-tinta: #FFFFFF;
      --accion-hover: #376FA9;

      --banda: #0F151D;
      --banda-tinta: #E3E6EA;
      --banda-apagado: #7F8896;
      --banda-campo: rgba(255,255,255,.05);
      --banda-linea: rgba(255,255,255,.11);
      --banda-linea-fuerte: rgba(255,255,255,.26);

      --chip-activo: #2C5C90;
      --chip-activo-tinta: #FFFFFF;
    }
  }

  :root[data-theme="dark"] {
    --papel: #0C1016;
    --panel: #131922;
    --panel-2: #0F151D;
    --tinta: #E3E6EA;
    --apagado: #8B929E;
    --tenue: #6E7684;
    --linea: #212934;
    --linea-fuerte: #34404F;

    --marca: #8FB6E4;
    --senal: #D9825C;
    --exito: #4FA684;

    --accion-fondo: #2C5C90;
    --accion-tinta: #FFFFFF;
    --accion-hover: #376FA9;

    --banda: #0F151D;
    --banda-tinta: #E3E6EA;
    --banda-apagado: #7F8896;
    --banda-campo: rgba(255,255,255,.05);
    --banda-linea: rgba(255,255,255,.11);
    --banda-linea-fuerte: rgba(255,255,255,.26);

    --chip-activo: #2C5C90;
    --chip-activo-tinta: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--papel);
    color: var(--tinta);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea, select { font: inherit; color: inherit; }

  .rotulo {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    font-family: var(--sans);
  }

  /* ─────────────────────── Banda de control ─────────────────────── */
  .banda {
    background: var(--banda);
    color: var(--banda-tinta);
    border-bottom: 1px solid var(--banda-linea-fuerte);
  }
  .banda-in { max-width: var(--ancho); margin: 0 auto; padding: 0 24px 18px; }

  .cabecera {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 16px 0 15px;
    border-bottom: 1px solid var(--banda-linea);
    margin-bottom: 16px;
  }
  .logotipo {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    white-space: nowrap;
  }
  .lema {
    color: var(--banda-apagado);
    font-size: 12px;
    flex: 1;
    min-width: 0;
    border-left: 1px solid var(--banda-linea);
    padding-left: 14px;
  }
  .cabecera-fin { display: flex; align-items: center; gap: 4px; }

  .enlace {
    color: var(--banda-apagado);
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radio);
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: color .12s, border-color .12s, background .12s;
  }
  .enlace:hover { color: var(--banda-tinta); border-color: var(--banda-linea); }

  .campos { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.35fr); gap: 16px; }
  .campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .campo > .rotulo { color: var(--banda-apagado); }
  .campo > .rotulo b { color: var(--senal); font-weight: 700; }

  .banda input,
  .banda textarea {
    width: 100%;
    background: var(--banda-campo);
    border: 1px solid var(--banda-linea);
    border-radius: var(--radio);
    color: var(--banda-tinta);
    padding: 9px 11px;
    outline: none;
    transition: border-color .12s, background .12s;
  }
  .banda input::placeholder, .banda textarea::placeholder { color: var(--banda-apagado); opacity: .7; }
  .banda input:focus, .banda textarea:focus {
    border-color: var(--banda-linea-fuerte);
    background: rgba(255,255,255,.11);
  }
  .banda input.falta { border-color: var(--senal); background: rgba(182,91,60,.18); }

  #producto { font-weight: 600; }
  .fila-url { display: flex; gap: 8px; }
  .fila-url input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }

  .btn-banda {
    background: transparent;
    border: 1px solid var(--banda-linea-fuerte);
    color: var(--banda-tinta);
    border-radius: var(--radio);
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s;
  }
  .btn-banda:hover { background: rgba(255,255,255,.1); }
  .btn-banda:disabled { opacity: .45; cursor: progress; }

  /* Datos leídos de la URL */
  .lectura {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--banda-linea);
  }
  .lectura-cab {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    color: var(--banda-apagado);
    font-size: 12px;
  }
  .lectura-cab .rotulo { color: var(--banda-tinta); }
  .lectura-cab .fuente { font-family: var(--mono); font-size: 11.5px; color: var(--banda-tinta); }
  .lectura-grid { display: grid; grid-template-columns: 1.2fr 1.6fr .6fr; gap: 12px; }

  .aviso {
    margin-top: 12px;
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: var(--radio);
    border: 1px solid rgba(217,130,92,.45);
    background: rgba(182,91,60,.16);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .aviso::before { content: '!'; font-family: var(--mono); font-weight: 500; color: var(--senal); }

  .notas { margin-top: 12px; }
  .notas summary {
    list-style: none;
    cursor: pointer;
    color: var(--banda-apagado);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 3px 0;
  }
  .notas summary::-webkit-details-marker { display: none; }
  .notas summary::before { content: '+'; font-family: var(--mono); }
  .notas[open] summary::before { content: '–'; }
  .notas summary:hover { color: var(--banda-tinta); }
  .notas textarea { margin-top: 8px; resize: vertical; min-height: 60px; line-height: 1.5; }

  /* ─────────────────────────── Taller ──────────────────────────── */
  main { max-width: var(--ancho); margin: 0 auto; padding: 0 24px 80px; }

  .filtros {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 0 13px;
    margin-bottom: 20px;
    background: var(--papel);
    border-bottom: 1px solid var(--linea);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--chip-fondo);
    border: 1px solid var(--linea-fuerte);
    border-radius: var(--radio);
    color: var(--apagado);
    padding: 5px 10px;
    cursor: pointer;
    transition: color .12s, background .12s, border-color .12s;
  }
  .chip:hover { color: var(--tinta); border-color: var(--tinta); }
  .chip[aria-pressed="true"] {
    background: var(--chip-activo);
    border-color: var(--chip-activo);
    color: var(--chip-activo-tinta);
  }
  .chip .cuenta {
    font-family: var(--mono);
    font-size: 10px;
    opacity: .65;
    font-weight: 400;
    letter-spacing: 0;
  }

  .buscador { position: relative; }
  .buscador input {
    width: 230px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--linea-fuerte);
    border-radius: var(--radio);
    padding: 6px 10px 6px 28px;
    outline: none;
    font-size: 13px;
    transition: border-color .12s;
  }
  .buscador input:focus { border-color: var(--marca); }
  .buscador::before {
    content: '⌕';
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-52%);
    color: var(--tenue);
    font-size: 15px;
    pointer-events: none;
  }
  .marcador {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--tenue);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Rejilla de prompts */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }

  .ficha {
    background: var(--panel);
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    padding: 15px 15px 13px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background .12s;
  }
  .ficha:hover { border-color: var(--linea-fuerte); }

  .ficha-cab { display: flex; align-items: flex-start; gap: 10px; }
  .ficha-cat { color: var(--apagado); flex: 1; min-width: 0; padding-top: 2px; }
  .estrella {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--linea-fuerte);
    font-size: 15px;
    line-height: 1;
    padding: 2px;
    transition: color .12s, transform .12s;
  }
  .estrella:hover { color: var(--senal); transform: scale(1.15); }
  .estrella[aria-pressed="true"] { color: var(--senal); }

  .ficha h3 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -.005em;
    text-wrap: balance;
  }
  .ficha .resumen { font-size: 12.5px; color: var(--apagado); line-height: 1.45; }

  .muestra {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--apagado);
    background: var(--panel-2);
    border: 1px solid var(--linea);
    border-left: 2px solid var(--linea-fuerte);
    border-radius: 0 var(--radio) var(--radio) 0;
    padding: 9px 10px;
    white-space: pre-wrap;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    max-height: 5.4em;
    flex: 1;
  }
  .muestra mark { background: rgba(182,91,60,.2); color: inherit; border-radius: 2px; padding: 0 1px; }

  .ficha-pie {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 11px;
    border-top: 1px solid var(--linea);
    margin-top: 2px;
  }
  .medida {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--tenue);
    flex: 1;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    background: var(--accion-fondo);
    color: var(--accion-tinta);
    border: 1px solid var(--accion-fondo);
    border-radius: var(--radio);
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--accion-hover); border-color: var(--accion-hover); }
  .btn.hecho { background: var(--exito); border-color: var(--exito); }

  .btn-plano {
    background: transparent;
    border: 1px solid var(--linea-fuerte);
    border-radius: var(--radio);
    color: var(--apagado);
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, border-color .12s;
  }
  .btn-plano:hover { color: var(--tinta); border-color: var(--tinta); }

  .grupo { margin-bottom: 30px; }
  .grupo-cab {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .grupo-cab h2 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .grupo-cab .marcador { flex: none; }
  .grupo-cab::after { content: ''; flex: 1; height: 1px; background: var(--linea); }

  .estado {
    text-align: center;
    padding: 56px 16px;
    color: var(--apagado);
    border: 1px dashed var(--linea-fuerte);
    border-radius: var(--radio);
    line-height: 1.6;
  }
  .estado code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--panel);
    border: 1px solid var(--linea);
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* ───────────────────────── Vista completa ────────────────────── */
  dialog {
    border: 1px solid var(--linea-fuerte);
    border-radius: var(--radio);
    padding: 0;
    width: min(760px, 94vw);
    background: var(--panel);
    color: var(--tinta);
  }
  dialog::backdrop { background: rgba(10,14,20,.6); }
  .dlg-cab {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--linea);
  }
  .dlg-cab h2 { font-size: 14.5px; font-weight: 600; flex: 1; min-width: 0; }
  .dlg-cuerpo { padding: 14px 16px; }
  .dlg-cuerpo textarea {
    width: 100%;
    min-height: 48vh;
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    background: var(--panel-2);
    padding: 13px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .dlg-cuerpo textarea:focus { border-color: var(--marca); }
  .dlg-pie {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 16px;
  }


  /* ───────────────────────────── Aviso flotante ─────────────────── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 14px);
    background: var(--tinta);
    color: var(--papel);
    padding: 10px 18px;
    border-radius: var(--radio);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
    z-index: 60;
    max-width: 92vw;
    text-align: center;
  }
  #toast.ver { opacity: 1; transform: translate(-50%, 0); }
  #toast.malo { background: var(--senal); color: #fff; }

  :where(button, a, input, textarea, summary):focus-visible {
    outline: 2px solid var(--senal);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  @media (max-width: 900px) {
    .lectura-grid { grid-template-columns: 1fr 1fr; }
    .lectura-grid .campo:last-child { grid-column: span 2; }
  }

  @media (max-width: 660px) {
    .banda-in, main { padding-left: 16px; padding-right: 16px; }
    .cabecera { flex-wrap: wrap; row-gap: 8px; }
    .lema { flex-basis: 100%; border-left: none; padding-left: 0; }
    .campos { grid-template-columns: 1fr; gap: 12px; }
    .lectura-grid { grid-template-columns: 1fr; }
    .lectura-grid .campo:last-child { grid-column: auto; }
    .rejilla { grid-template-columns: 1fr; }
    .buscador input { width: 100%; }
    .buscador { flex: 1; min-width: 140px; }
    /* En móvil los chips se leen mejor en una tira que se desliza que apilados */
    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      flex-basis: 100%;
      padding-bottom: 2px;
      margin: 0 -16px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; white-space: nowrap; }
    .dlg-cuerpo textarea { min-height: 42vh; }
  }
</style>

<div class="banda">
    <div class="banda-in">
      <div class="cabecera">
        <span class="logotipo">Asistente de Prompts</span>
        <span class="lema" id="lema">Escribe el producto, pega la URL y copia el prompt ya armado.</span>
        <span class="cabecera-fin">
          <a id="linkHoja" class="enlace" target="_blank" rel="noopener" hidden>Editar en Sheets ↗</a>
          <button id="btnRecargar" class="enlace" title="Volver a leer la hoja">Recargar</button>
        </span>
      </div>

      <div class="campos">
        <label class="campo">
          <span class="rotulo">Producto <b>*</b></span>
          <input id="producto" autocomplete="off" placeholder="Silla Ergonómica Pro Comfort Mesh">
        </label>
        <label class="campo">
          <span class="rotulo">URL de referencia</span>
          <span class="fila-url">
            <input id="url" type="url" autocomplete="off" placeholder="https://...">
            <button id="btnLeer" class="btn-banda">Leer URL</button>
          </span>
        </label>
      </div>

      <div id="lectura" class="lectura" hidden>
        <div class="lectura-cab">
          <span class="rotulo">Datos leídos</span>
          <span class="fuente" id="metaSitio"></span>
          <span>edítalos si vienen mal: se usan tal cual en los prompts</span>
        </div>
        <div class="lectura-grid">
          <label class="campo">
            <span class="rotulo">Título</span>
            <input id="mTitulo" autocomplete="off">
          </label>
          <label class="campo">
            <span class="rotulo">Descripción</span>
            <input id="mDescripcion" autocomplete="off">
          </label>
          <label class="campo">
            <span class="rotulo">Precio</span>
            <input id="mPrecio" autocomplete="off">
          </label>
        </div>
      </div>

      <div id="avisoUrl" class="aviso" hidden></div>

      <details class="notas">
        <summary>Notas extra: contexto que se mete en todos los prompts</summary>
        <label class="campo">
          <textarea id="extra" placeholder="Público objetivo, ángulo que quieres, restricciones, lo que ya probaste..."></textarea>
        </label>
      </details>
    </div>
  </div>

  <main>
    <div class="filtros">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
      <span class="buscador">
        <input id="buscar" type="search" placeholder="Buscar prompt…" aria-label="Buscar prompt">
      </span>
      <span class="marcador" id="contador"></span>
    </div>

    <div id="lista"></div>
    <div id="estado" class="estado">Cargando prompts…</div>
  </main>

  <dialog id="modal">
    <div class="dlg-cab">
      <h2 id="dlgTitulo">Vista previa</h2>
      <button id="dlgCerrar" class="btn-plano" aria-label="Cerrar">Cerrar</button>
    </div>
    <div class="dlg-cuerpo">
      <textarea id="dlgTexto" spellcheck="false" aria-label="Prompt generado"></textarea>
    </div>
    <div class="dlg-pie">
      <span class="medida" id="dlgMedida"></span>
      <button id="dlgCopiar" class="btn">Copiar prompt</button>
    </div>

    if (/amazon\.|aliexpress\./i.test(dominio)) {
      return { ok: false, sitio: dominio,
        error: 'La página respondió 503. Ese sitio bloquea lectores automáticos: rellena los campos a mano.' };
    }
    return {
      ok: true,
      sitio: dominio,
      titulo: 'Silla ergonómica de malla con soporte lumbar ajustable y reposacabezas',
      descripcion: 'Silla de oficina con respaldo de malla transpirable, soporte lumbar regulable en altura y profundidad, reposabrazos 4D y mecanismo sincronizado con cinco posiciones de bloqueo.',
      precio: '289.00 EUR',
      imagen: '',
      error: ''
    };
  }
};
</script>

<script>
(function () {
  'use strict';

  var CLAVE = 'asistente-prompts';
  var estado = { prompts: [], filtro: '', categoria: 'todos', favoritos: [], meta: {} };
  var $ = function (id) { return document.getElementById(id); };

  /* ── Puente con el backend (o con el mock de la vista previa) ── */
  function api(nombre) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, mal) {
      if (window.MOCK_API && window.MOCK_API[nombre]) {
        setTimeout(function () {
          try { ok(window.MOCK_API[nombre].apply(null, args)); } catch (e) { mal(e); }
        }, window.MOCK_API.__retardo || 220);
        return;
      }
      google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[nombre].apply(null, args);
    });
  }

  /* ── Persistencia ── */
  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify({
        producto: $('producto').value,
        url: $('url').value,
        extra: $('extra').value,
        meta: estado.meta,
        favoritos: estado.favoritos
      }));
    } catch (e) { /* incógnito */ }
  }

  function restaurar() {
    var d;
    try { d = JSON.parse(localStorage.getItem(CLAVE) || '{}'); } catch (e) { d = {}; }
    $('producto').value = d.producto || '';
    $('url').value = d.url || '';
    $('extra').value = d.extra || '';
    estado.favoritos = Array.isArray(d.favoritos) ? d.favoritos : [];
    if (d.extra) $('extra').closest('details').open = true;
    if (d.meta && (d.meta.titulo || d.meta.descripcion || d.meta.precio)) pintarLectura(d.meta);
  }

  /* ── Variables de plantilla ──
     modoMuestra deja marcadores visibles en lugar de vaciar los huecos,
     para que la tarjeta enseñe la forma del prompt antes de rellenar nada. */
  function variables(modoMuestra) {
    var url = $('url').value.trim();
    var m = url.match(/^https?:\/\/([^\/\?#:]+)/i);
    var hoy = new Date();
    var v = {
      producto: $('producto').value.trim(),
      url: url,
      titulo: $('mTitulo').value.trim(),
      descripcion: $('mDescripcion').value.trim(),
      precio: $('mPrecio').value.trim(),
      sitio: m ? m[1].replace(/^www\./i, '') : '',
      extra: $('extra').value.trim(),
      fecha: hoy.getFullYear() + '-' +
        String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
        String(hoy.getDate()).padStart(2, '0')
    };
    if (modoMuestra) {
      Object.keys(v).forEach(function (k) { if (!v[k]) v[k] = '‹' + k + '›'; });
    }
    return v;
  }

  var PATRON = /\{\{\s*(\w+)\s*\}\}/g;

  /**
   * Rellena la plantilla. Si una línea contiene SOLO variables vacías,
   * la línea entera desaparece: no quedan etiquetas huérfanas tipo "Precio:".
   */
  function rellenar(plantilla, vars) {
    return String(plantilla).split('\n').filter(function (linea) {
      var usadas = linea.match(PATRON);
      if (!usadas) return true;
      return usadas.some(function (t) {
        return String(vars[t.replace(/[{}\s]/g, '')] || '').trim() !== '';
      });
    }).map(function (linea) {
      return linea.replace(PATRON, function (_, clave) {
        return vars[clave] != null ? vars[clave] : '';
      });
    }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function palabras(texto) {
    var n = texto.trim().split(/\s+/).filter(Boolean).length;
    return n;
  }

  /* ── Portapapeles, con dos planes B ── */
  function copiar(texto) {
    return new Promise(function (ok, mal) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(ok).catch(function () { viejaEscuela(texto, ok, mal); });
      } else {
        viejaEscuela(texto, ok, mal);
      }
    });
  }

  function viejaEscuela(texto, ok, mal) {
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, texto.length);
    var bien = false;
    try { bien = document.execCommand('copy'); } catch (e) { bien = false; }
    document.body.removeChild(ta);
    bien ? ok() : mal(new Error('sin-portapapeles'));
  }

  var relojToast;
  function toast(texto, malo) {
    var t = $('toast');
    t.textContent = texto;
    t.className = 'ver' + (malo ? ' malo' : '');
    clearTimeout(relojToast);
    relojToast = setTimeout(function () { t.className = ''; }, 2600);
  }

  function escapar(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── Filtros ── */
  function esFavorito(p) { return estado.favoritos.indexOf(p.nombre) > -1; }

  function categorias() {
    var vistas = [];
    estado.prompts.forEach(function (p) {
      if (vistas.indexOf(p.categoria) === -1) vistas.push(p.categoria);
    });
    return vistas;
  }

  function coincide(p) {
    if (estado.categoria === 'favoritos' && !esFavorito(p)) return false;
    if (estado.categoria !== 'todos' && estado.categoria !== 'favoritos' && p.categoria !== estado.categoria) return false;
    if (!estado.filtro) return true;
    var q = estado.filtro.toLowerCase();
    return (p.nombre + ' ' + p.categoria + ' ' + p.descripcion + ' ' + p.destino + ' ' + p.plantilla)
      .toLowerCase().indexOf(q) > -1;
  }

  function pintarChips() {
    var cont = $('chips');
    cont.innerHTML = '';
    var opciones = [{ id: 'todos', texto: 'Todos', n: estado.prompts.length }];
    if (estado.favoritos.length) {
      opciones.push({
        id: 'favoritos', texto: '★ Favoritos',
        n: estado.prompts.filter(esFavorito).length
      });
    }
    categorias().forEach(function (c) {
      opciones.push({
        id: c, texto: c,
        n: estado.prompts.filter(function (p) { return p.categoria === c; }).length
      });
    });

    opciones.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'chip rotulo';
      b.type = 'button';
      b.setAttribute('aria-pressed', String(estado.categoria === o.id));
      b.innerHTML = escapar(o.texto) + ' <span class="cuenta">' + o.n + '</span>';
      b.addEventListener('click', function () {
        estado.categoria = o.id;
        pintarChips();
        pintarLista();
      });
      cont.appendChild(b);
    });
  }

  /* ── Rejilla ── */
  function pintarLista() {
    var cont = $('lista');
    var visibles = estado.prompts.filter(coincide);
    var vars = variables(true);

    $('contador').textContent = visibles.length === estado.prompts.length
      ? estado.prompts.length + ' prompts'
      : visibles.length + ' de ' + estado.prompts.length + ' prompts';

    cont.innerHTML = '';

    if (!visibles.length) {
      $('estado').hidden = false;
      $('estado').innerHTML = estado.prompts.length
        ? 'Ningún prompt coincide con el filtro.'
        : 'La hoja no tiene prompts activos. Añade filas y pulsa <b>Recargar</b>.';
      return;
    }
    $('estado').hidden = true;

    var agrupar = estado.categoria === 'todos' && !estado.filtro;

    if (!agrupar) {
      var rejilla = document.createElement('div');
      rejilla.className = 'rejilla';
      visibles.forEach(function (p) { rejilla.appendChild(ficha(p, vars, false)); });
      cont.appendChild(rejilla);
      return;
    }

    categorias().forEach(function (c) {
      var delGrupo = visibles.filter(function (p) { return p.categoria === c; });
      if (!delGrupo.length) return;

      var grupo = document.createElement('section');
      grupo.className = 'grupo';
      var cab = document.createElement('div');
      cab.className = 'grupo-cab';
      cab.innerHTML = '<h2>' + escapar(c) + '</h2><span class="marcador">' + delGrupo.length + '</span>';
      grupo.appendChild(cab);

      var r = document.createElement('div');
      r.className = 'rejilla';
      delGrupo.forEach(function (p) { r.appendChild(ficha(p, vars, true)); });
      grupo.appendChild(r);
      cont.appendChild(grupo);
    });
  }

  function ficha(p, vars, agrupado) {
    var completo = rellenar(p.plantilla, vars);
    var n = palabras(completo);
    // En 4 líneas de tarjeta no caben renglones vacíos: se enseñan las 4 primeras con contenido.
    var muestra = completo.split('\n').filter(function (l) { return l.trim(); }).slice(0, 4).join('\n');

    var el = document.createElement('article');
    el.className = 'ficha';
    el.innerHTML =
      '<div class="ficha-cab">' +
      '  <span class="ficha-cat rotulo">' + escapar(agrupado ? (p.destino || 'Prompt') : p.categoria) + '</span>' +
      '  <button class="estrella" type="button" aria-pressed="' + esFavorito(p) + '" title="Marcar como favorito">' +
         (esFavorito(p) ? '★' : '☆') + '</button>' +
      '</div>' +
      '<h3>' + escapar(p.nombre) + '</h3>' +
      (p.descripcion ? '<p class="resumen">' + escapar(p.descripcion) + '</p>' : '') +
      '<pre class="muestra">' + escapar(muestra) + '</pre>' +
      '<div class="ficha-pie">' +
      '  <span class="medida">≈' + n + ' palabras' +
           (!agrupado && p.destino ? ' · ' + escapar(p.destino) : '') + '</span>' +
      '  <button class="btn-plano" type="button" data-accion="ver">Ver</button>' +
      '  <button class="btn" type="button" data-accion="copiar">Copiar</button>' +
      '</div>';

    el.querySelector('.estrella').addEventListener('click', function (ev) {
      var i = estado.favoritos.indexOf(p.nombre);
      i > -1 ? estado.favoritos.splice(i, 1) : estado.favoritos.push(p.nombre);
      guardar();
      ev.currentTarget.textContent = esFavorito(p) ? '★' : '☆';
      ev.currentTarget.setAttribute('aria-pressed', String(esFavorito(p)));
      pintarChips();
      if (estado.categoria === 'favoritos') pintarLista();
    });
    el.querySelector('[data-accion="ver"]').addEventListener('click', function () { abrirModal(p); });
    el.querySelector('[data-accion="copiar"]').addEventListener('click', function (ev) { alCopiar(p, ev.currentTarget); });

    return el;
  }

  /* ── Acciones ── */
  function faltaProducto() {
    if ($('producto').value.trim()) return false;
    $('producto').classList.add('falta');
    $('producto').focus();
    $('producto').scrollIntoView({ block: 'center', behavior: 'smooth' });
    toast('Escribe primero el nombre del producto', true);
    setTimeout(function () { $('producto').classList.remove('falta'); }, 1800);
    return true;
  }

  function alCopiar(p, boton) {
    if (faltaProducto()) return;
    var texto = rellenar(p.plantilla, variables());
    copiar(texto).then(function () {
      boton.textContent = '✓ Copiado';
      boton.classList.add('hecho');
      setTimeout(function () {
        boton.textContent = 'Copiar';
        boton.classList.remove('hecho');
      }, 1600);
      toast('Prompt copiado · ' + palabras(texto) + ' palabras');
    }).catch(function () {
      abrirModal(p, true);
      toast('El navegador bloqueó el portapapeles: copia desde aquí', true);
    });
  }

  function abrirModal(p, seleccionar) {
    if (faltaProducto()) return;
    var texto = rellenar(p.plantilla, variables());
    $('dlgTitulo').textContent = p.nombre;
    $('dlgTexto').value = texto;
    $('dlgMedida').textContent = p.categoria + ' · ≈' + palabras(texto) + ' palabras · ' + texto.length + ' caracteres';
    $('modal').showModal();
    if (seleccionar) { $('dlgTexto').focus(); $('dlgTexto').select(); }
  }

  function pintarLectura(datos) {
    estado.meta = datos || {};
    $('mTitulo').value = datos.titulo || '';
    $('mDescripcion').value = datos.descripcion || '';
    $('mPrecio').value = datos.precio || '';
    $('metaSitio').textContent = datos.sitio || '';
    $('lectura').hidden = false;
  }

  function leerUrl() {
    var url = $('url').value.trim();
    $('avisoUrl').hidden = true;
    if (!url) {
      $('lectura').hidden = true;
      estado.meta = {};
      guardar();
      pintarLista();
      return;
    }

    var b = $('btnLeer');
    b.disabled = true;
    b.textContent = 'Leyendo…';

    api('leerUrl', url).then(function (r) {
      if (r.ok) {
        pintarLectura(r);
        toast('Datos leídos de ' + (r.sitio || 'la página'));
      } else {
        pintarLectura({ sitio: r.sitio || '', titulo: '', descripcion: '', precio: '' });
        $('avisoUrl').textContent = r.error + ' La URL se sigue insertando en los prompts.';
        $('avisoUrl').hidden = false;
      }
      guardar();
      pintarLista();
    }).catch(function (e) {
      $('avisoUrl').textContent = 'Error al leer la URL: ' + ((e && e.message) || e);
      $('avisoUrl').hidden = false;
    }).then(function () {
      b.disabled = false;
      b.textContent = 'Leer URL';
    });
  }

  function cargarPrompts(forzar) {
    $('estado').hidden = false;
    $('estado').textContent = forzar ? 'Recargando…' : 'Cargando prompts…';
    return api('getPrompts', !!forzar).then(function (lista) {
      estado.prompts = lista || [];
      $('lema').textContent = estado.prompts.length +
        ' plantillas que se rellenan solas con el producto y la URL.';
      pintarChips();
      pintarLista();
    }).catch(function (e) {
      var msg = (e && e.message) || String(e);
      $('estado').innerHTML = msg.indexOf('No hay hoja') > -1
        ? 'Todavía no hay hoja de prompts.<br>Abre el editor de Apps Script y ejecuta <code>crearHojaDePrompts()</code>.'
        : 'No pude leer los prompts:<br>' + escapar(msg);
      $('estado').hidden = false;
    });
  }

  /* ── Arranque ── */
  function iniciar() {
    restaurar();

    var reloj;
    ['producto', 'url', 'extra', 'mTitulo', 'mDescripcion', 'mPrecio'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        estado.meta = {
          titulo: $('mTitulo').value,
          descripcion: $('mDescripcion').value,
          precio: $('mPrecio').value,
          sitio: $('metaSitio').textContent
        };
        guardar();
        clearTimeout(reloj);
        reloj = setTimeout(pintarLista, 280);
      });
    });

    $('btnLeer').addEventListener('click', leerUrl);
    $('url').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); leerUrl(); }
    });

    $('buscar').addEventListener('input', function (e) {
      estado.filtro = e.target.value.trim();
      pintarLista();
    });

    $('btnRecargar').addEventListener('click', function () { cargarPrompts(true); });
    $('dlgCerrar').addEventListener('click', function () { $('modal').close(); });
    $('dlgCopiar').addEventListener('click', function () {
      copiar($('dlgTexto').value).then(function () {
        toast('Prompt copiado');
        $('modal').close();
      }).catch(function () {
        $('dlgTexto').focus();
        $('dlgTexto').select();
        toast('Pulsa Ctrl+C / Cmd+C para copiar', true);
      });
    });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        $('buscar').focus();
      }
    });

    api('getEstado').then(function (s) {
      if (s && s.hojaUrl) {
        $('linkHoja').href = s.hojaUrl;
        $('linkHoja').hidden = false;
      }
    }).catch(function () { /* sin enlace, no pasa nada */ });

    cargarPrompts(false);
  }

  document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
