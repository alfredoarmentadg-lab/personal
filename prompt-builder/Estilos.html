<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
  /* ─────────────────────────── Sistema visual ───────────────────────────
     Referencia: terminal de investigación / informe anual. Casi monocromo.
     Color:  grafito y papel frío. El negro es la acción. El burdeos aparece
             solo para marcar estado (favorito, obligatorio, aviso). Nada más.
     Tipo:   Newsreader (identidad y titulares de sección) · Archivo (interfaz)
             · JetBrains Mono (texto de máquina: prompts, contadores, variables).
     Trazo:  esquinas rectas, filete de 1px, cero sombras, cero degradados.
  ────────────────────────────────────────────────────────────────────── */

  :root {
    --tinta: #131417;
    --apagado: #62666E;
    --tenue: #8B8F97;
    --papel: #EDEEF0;
    --panel: #FFFFFF;
    --panel-2: #F6F7F8;
    --linea: #DBDDE1;
    --linea-fuerte: #B7BAC1;

    --acento: #8C3141;
    --acento-fondo: rgba(140,49,65,.09);
    --acento-linea: rgba(140,49,65,.32);
    --exito: #14603F;

    --accion: #131417;
    --accion-hover: #383B42;
    --accion-tinta: #FFFFFF;

    --banda: #131417;
    --banda-tinta: #F1F2F4;
    --banda-apagado: #888D96;
    --banda-linea: rgba(255,255,255,.13);
    --banda-linea-fuerte: rgba(255,255,255,.3);
    --banda-campo: rgba(255,255,255,.05);

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --ancho: 1200px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tinta: #E9EAED;
      --apagado: #91969F;
      --tenue: #6C717A;
      --papel: #0A0B0D;
      --panel: #131519;
      --panel-2: #0F1114;
      --linea: #23262C;
      --linea-fuerte: #3A3E45;

      --acento: #CB7583;
      --acento-fondo: rgba(203,117,131,.11);
      --acento-linea: rgba(203,117,131,.34);
      --exito: #48A57C;

      --accion: #E9EAED;
      --accion-hover: #FFFFFF;
      --accion-tinta: #131417;

      --banda: #0F1114;
      --banda-tinta: #E9EAED;
      --banda-apagado: #7D828B;
      --banda-linea: rgba(255,255,255,.1);
      --banda-linea-fuerte: rgba(255,255,255,.24);
      --banda-campo: rgba(255,255,255,.04);
    }
  }

  :root[data-theme="dark"] {
    --tinta: #E9EAED;
    --apagado: #91969F;
    --tenue: #6C717A;
    --papel: #0A0B0D;
    --panel: #131519;
    --panel-2: #0F1114;
    --linea: #23262C;
    --linea-fuerte: #3A3E45;

    --acento: #CB7583;
    --acento-fondo: rgba(203,117,131,.11);
    --acento-linea: rgba(203,117,131,.34);
    --exito: #48A57C;

    --accion: #E9EAED;
    --accion-hover: #FFFFFF;
    --accion-tinta: #131417;

    --banda: #0F1114;
    --banda-tinta: #E9EAED;
    --banda-apagado: #7D828B;
    --banda-linea: rgba(255,255,255,.1);
    --banda-linea-fuerte: rgba(255,255,255,.24);
    --banda-campo: rgba(255,255,255,.04);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--papel);
    color: var(--tinta);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea { font: inherit; color: inherit; }

  .rotulo {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
  }

  /* ─────────────────────────── Banda de mando ─────────────────────────── */
  .banda { background: var(--banda); color: var(--banda-tinta); border-bottom: 1px solid var(--linea); }
  .banda-in { max-width: var(--ancho); margin: 0 auto; padding: 0 28px; }

  .cabecera {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 18px 0 16px;
    border-bottom: 1px solid var(--banda-linea);
  }
  .logotipo {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -.015em;
    white-space: nowrap;
  }
  .lema {
    color: var(--banda-apagado);
    font-size: 12px;
    flex: 1;
    min-width: 0;
  }
  .cabecera-fin { display: flex; align-items: center; gap: 2px; }

  .enlace {
    color: var(--banda-apagado);
    background: none;
    border: 1px solid transparent;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .04em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: color .12s, border-color .12s;
  }
  .enlace:hover { color: var(--banda-tinta); border-color: var(--banda-linea-fuerte); }

  .campos {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1.3fr);
    gap: 0;
    border-bottom: 1px solid var(--banda-linea);
  }
  .campos > .campo:first-child { border-right: 1px solid var(--banda-linea); padding-right: 24px; }
  .campos > .campo:last-child { padding-left: 24px; }
  .campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 13px 0; }
  .campo > .rotulo { color: var(--banda-apagado); }
  .campo > .rotulo b { color: var(--acento); font-weight: 700; }

  /* Campos sin caja: solo un filete inferior. Menos formulario, más instrumento. */
  .banda input, .banda textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--banda-linea-fuerte);
    color: var(--banda-tinta);
    padding: 5px 0 7px;
    outline: none;
    transition: border-color .12s;
  }
  .banda textarea {
    border: 1px solid var(--banda-linea);
    background: var(--banda-campo);
    padding: 9px 11px;
  }
  .banda input::placeholder, .banda textarea::placeholder { color: var(--banda-apagado); opacity: .55; }
  .banda input:focus, .banda textarea:focus { border-color: var(--banda-tinta); }
  .banda input.falta { border-color: var(--acento); }

  #producto { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .fila-url { display: flex; gap: 12px; align-items: flex-end; }
  .fila-url input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }

  .btn-banda {
    background: transparent;
    border: 1px solid var(--banda-linea-fuerte);
    color: var(--banda-tinta);
    padding: 7px 15px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .btn-banda:hover { background: var(--banda-tinta); color: var(--banda); }
  .btn-banda:disabled { opacity: .4; cursor: progress; }

  /* Datos leídos de la URL */
  .lectura { border-bottom: 1px solid var(--banda-linea); padding: 13px 0 14px; }
  .lectura-cab {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    color: var(--banda-apagado);
    font-size: 11.5px;
  }
  .lectura-cab .rotulo { color: var(--banda-tinta); }
  .lectura-cab .fuente { font-family: var(--mono); font-size: 11.5px; color: var(--acento); }
  .lectura-grid { display: grid; grid-template-columns: 1.1fr 1.7fr .5fr; gap: 22px; }
  .lectura-grid .campo { padding: 0; }

  .aviso {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 11px 13px;
    margin: 14px 0 0;
    border: 1px solid var(--acento-linea);
    background: var(--acento-fondo);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .aviso::before { content: '!'; font-family: var(--mono); font-weight: 500; color: var(--acento); }

  .notas { border-bottom: 1px solid var(--banda-linea); }
  .notas summary {
    list-style: none;
    cursor: pointer;
    color: var(--banda-apagado);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    font-size: 12px;
  }
  .notas summary::-webkit-details-marker { display: none; }
  .notas summary::before { content: '+'; font-family: var(--mono); width: 9px; }
  .notas[open] summary::before { content: '−'; }
  .notas summary:hover { color: var(--banda-tinta); }
  .notas textarea { margin-bottom: 12px; resize: vertical; min-height: 56px; line-height: 1.5; }

  /* Tira de variables: qué huecos tienen valor ahora mismo */
  .variables {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 10px 0 11px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .variables > .rotulo { font-family: var(--sans); color: var(--banda-apagado); }
  .vlista { display: flex; gap: 13px; flex-wrap: wrap; }
  .var { display: inline-flex; align-items: center; gap: 5px; color: var(--banda-apagado); }
  .var::before { content: '○'; font-size: 9px; }
  .var.lleno { color: var(--banda-tinta); }
  .var.lleno::before { content: '●'; color: var(--exito); }

  /* ──────────────────────────── Biblioteca ───────────────────────────── */
  main { max-width: var(--ancho); margin: 0 auto; padding: 0 28px 80px; }

  .filtros {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 15px 0 14px;
    margin-bottom: 24px;
    background: var(--papel);
    border-bottom: 1px solid var(--linea-fuerte);
  }
  .chips { display: flex; gap: 0; flex-wrap: wrap; flex: 1; min-width: 0; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid var(--linea-fuerte);
    margin: 0 -1px -1px 0;
    color: var(--apagado);
    padding: 6px 11px;
    cursor: pointer;
    transition: color .12s, background .12s, border-color .12s;
  }
  .chip:hover { color: var(--tinta); background: var(--panel); }
  .chip[aria-pressed="true"] {
    background: var(--accion);
    border-color: var(--accion);
    color: var(--accion-tinta);
    position: relative;
    z-index: 1;
  }
  .chip .cuenta { font-family: var(--mono); font-size: 10px; opacity: .6; font-weight: 400; letter-spacing: 0; }

  .buscador { position: relative; }
  .buscador input {
    width: 220px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--linea-fuerte);
    padding: 7px 11px 7px 27px;
    outline: none;
    font-size: 13px;
    transition: border-color .12s;
  }
  .buscador input:focus { border-color: var(--tinta); }
  .buscador::before {
    content: '⌕';
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-52%);
    color: var(--tenue);
    font-size: 15px;
    pointer-events: none;
  }
  .marcador {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--tenue);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .grupo { margin-bottom: 34px; }
  .grupo-cab { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .grupo-cab h2 {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -.015em;
  }
  .grupo-cab::after { content: ''; flex: 1; height: 1px; background: var(--linea-fuerte); }
  .grupo-cab .marcador { flex: none; order: 3; }

  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

  .ficha {
    background: var(--panel);
    border: 1px solid var(--linea);
    padding: 15px 16px 13px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: border-color .12s;
  }
  .ficha:hover { border-color: var(--tinta); }

  .ficha-cab { display: flex; align-items: flex-start; gap: 10px; }
  .ficha-cat { color: var(--tenue); flex: 1; min-width: 0; padding-top: 2px; }
  .estrella {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--linea-fuerte);
    font-size: 14px;
    line-height: 1;
    padding: 2px;
    transition: color .12s;
  }
  .estrella:hover, .estrella[aria-pressed="true"] { color: var(--acento); }

  .ficha h3 {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.28;
    letter-spacing: -.012em;
    text-wrap: balance;
  }
  .ficha .resumen { font-size: 12.5px; color: var(--apagado); line-height: 1.45; }

  .muestra {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--apagado);
    background: var(--panel-2);
    border-left: 2px solid var(--linea-fuerte);
    padding: 9px 11px;
    white-space: pre-wrap;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    max-height: 5.6em;
    flex: 1;
  }

  .usa {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--tenue);
  }
  .usa span.falta-dato { color: var(--acento); text-decoration: line-through; text-decoration-thickness: 1px; }

  .ficha-pie {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 11px;
    border-top: 1px solid var(--linea);
    margin-top: 2px;
  }
  .medida {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--tenue);
    flex: 1;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    background: var(--accion);
    color: var(--accion-tinta);
    border: 1px solid var(--accion);
    padding: 7px 15px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--accion-hover); border-color: var(--accion-hover); }
  .btn.hecho { background: var(--exito); border-color: var(--exito); color: #fff; }

  .btn-plano {
    background: transparent;
    border: 1px solid var(--linea-fuerte);
    color: var(--apagado);
    padding: 7px 13px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, border-color .12s;
  }
  .btn-plano:hover { color: var(--tinta); border-color: var(--tinta); }

  .estado {
    text-align: center;
    padding: 60px 16px;
    color: var(--apagado);
    border: 1px solid var(--linea);
    background: var(--panel);
    line-height: 1.6;
  }
  .estado code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--panel-2);
    border: 1px solid var(--linea);
    padding: 2px 6px;
  }

  /* ───────────────────────────── Vista completa ───────────────────────── */
  dialog {
    border: 1px solid var(--tinta);
    padding: 0;
    width: min(780px, 94vw);
    background: var(--panel);
    color: var(--tinta);
  }
  dialog::backdrop { background: rgba(10,11,13,.66); }
  .dlg-cab {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--linea);
  }
  .dlg-cab h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -.015em;
    flex: 1;
    min-width: 0;
  }
  .dlg-cuerpo { padding: 16px 18px; }
  .dlg-cuerpo textarea {
    width: 100%;
    min-height: 46vh;
    border: 1px solid var(--linea);
    background: var(--panel-2);
    padding: 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    resize: vertical;
    outline: none;
  }
  .dlg-cuerpo textarea:focus { border-color: var(--tinta); }
  .dlg-pie { display: flex; align-items: center; gap: 10px; padding: 0 18px 18px; }

  /* ──────────────────────────────── Aviso ─────────────────────────────── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 12px);
    background: var(--accion);
    color: var(--accion-tinta);
    padding: 11px 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
    z-index: 60;
    max-width: 92vw;
    text-align: center;
  }
  #toast.ver { opacity: 1; transform: translate(-50%, 0); }
  #toast.malo { background: var(--acento); color: #fff; }

  :where(button, a, input, textarea, summary):focus-visible {
    outline: 2px solid var(--acento);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  @media (max-width: 900px) {
    .lectura-grid { grid-template-columns: 1fr 1fr; gap: 18px; }
    .lectura-grid .campo:last-child { grid-column: span 2; }
  }

  @media (max-width: 680px) {
    .banda-in, main { padding-left: 18px; padding-right: 18px; }
    .cabecera { flex-wrap: wrap; row-gap: 6px; padding-bottom: 14px; }
    .lema { flex-basis: 100%; order: 3; }
    .campos { grid-template-columns: 1fr; }
    .campos > .campo:first-child { border-right: none; padding-right: 0; border-bottom: 1px solid var(--banda-linea); }
    .campos > .campo:last-child { padding-left: 0; }
    .lectura-grid { grid-template-columns: 1fr; gap: 14px; }
    .lectura-grid .campo:last-child { grid-column: auto; }
    .rejilla { grid-template-columns: 1fr; }
    .buscador { flex: 1; min-width: 150px; }
    .buscador input { width: 100%; }
    /* Los chips se leen mejor en una tira deslizable que apilados */
    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      flex-basis: 100%;
      margin: 0 -18px;
      padding: 0 18px;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; white-space: nowrap; margin: 0 -1px 0 0; }
    .dlg-cuerpo textarea { min-height: 42vh; }
  }
</style>
