<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de Prompts</title>
  <?!= include('Estilos'); ?>
</head>
<body>

  <div class="banda">
    <div class="banda-in">
      <div class="cabecera">
        <span class="logotipo">Asistente de Prompts</span>
        <span class="lema" id="lema">Escribe el producto, pega la URL y copia el prompt ya armado.</span>
        <span class="cabecera-fin">
          <a id="linkHoja" class="enlace" target="_blank" rel="noopener" hidden>Editar en Sheets ↗</a>
          <button id="btnRecargar" class="enlace" title="Volver a leer la hoja">Recargar</button>
        </span>
      </div>

      <div class="campos">
        <label class="campo">
          <span class="rotulo">Producto <b>*</b></span>
          <input id="producto" autocomplete="off" placeholder="Silla Ergonómica Pro Comfort Mesh">
        </label>
        <label class="campo">
          <span class="rotulo">URL de referencia</span>
          <span class="fila-url">
            <input id="url" type="url" autocomplete="off" placeholder="https://...">
            <button id="btnLeer" class="btn-banda">Leer URL</button>
          </span>
        </label>
      </div>

      <div id="lectura" class="lectura" hidden>
        <div class="lectura-cab">
          <span class="rotulo">Datos leídos</span>
          <span class="fuente" id="metaSitio"></span>
          <span>edítalos si vienen mal: se usan tal cual en los prompts</span>
        </div>
        <div class="lectura-grid">
          <label class="campo">
            <span class="rotulo">Título</span>
            <input id="mTitulo" autocomplete="off">
          </label>
          <label class="campo">
            <span class="rotulo">Descripción</span>
            <input id="mDescripcion" autocomplete="off">
          </label>
          <label class="campo">
            <span class="rotulo">Precio</span>
            <input id="mPrecio" autocomplete="off">
          </label>
        </div>
      </div>

      <div id="avisoUrl" class="aviso" hidden></div>

      <details class="notas">
        <summary>Notas extra: contexto que se mete en todos los prompts</summary>
        <label class="campo">
          <textarea id="extra" placeholder="Público objetivo, ángulo que quieres, restricciones, lo que ya probaste..."></textarea>
        </label>
      </details>
    </div>
  </div>

  <main>
    <div class="filtros">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
      <span class="buscador">
        <input id="buscar" type="search" placeholder="Buscar prompt…" aria-label="Buscar prompt">
      </span>
      <span class="marcador" id="contador"></span>
    </div>

    <div id="lista"></div>
    <div id="estado" class="estado">Cargando prompts…</div>
  </main>

  <dialog id="modal">
    <div class="dlg-cab">
      <h2 id="dlgTitulo">Vista previa</h2>
      <button id="dlgCerrar" class="btn-plano" aria-label="Cerrar">Cerrar</button>
    </div>
    <div class="dlg-cuerpo">
      <textarea id="dlgTexto" spellcheck="false" aria-label="Prompt generado"></textarea>
    </div>
    <div class="dlg-pie">
      <span class="medida" id="dlgMedida"></span>
      <button id="dlgCopiar" class="btn">Copiar prompt</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <?!= include('App'); ?>
</body>
</html>
